# Local Postgres for development and tests.
#
# The pgvector image rather than plain postgres: it ships the extension
# preinstalled, and D13 puts job and profile embeddings in `vector` columns.
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: jobsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: jobsearch
      POSTGRES_DB: jobsearch
    ports:
      # 5433 on the host, not 5432: a developer machine usually already has a
      # Postgres on the default port -- another project's container was on it
      # the first time this ran. Override with POSTGRES_PORT if 5433 is taken too.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations and tests wait on this, so it has to mean "accepting
      # queries", not just "process started".
      test: ['CMD-SHELL', 'pg_isready -U jobsearch -d jobsearch']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
